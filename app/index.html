<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const q=new URLSearchParams(location.search);
const MOCK=location.protocol=="file:"||(["localhost","127.0.0.1"].includes(location.hostname)&&q.has("mock"));
const seed=()=>({stages:[{id:"idea",name:"الأفكار والسكريبت"},{id:"design",name:"التصميم والستوري بورد"},{id:"gen",name:"التوليد"},{id:"edit",name:"المونتاج والصوت"},{id:"review",name:"المراجعة والتسليم"}],
 settings:{platform_name:"ROUA",reminder_hours:2,notify_assigned:true,notify_handoff:true,notify_deadline:true},
 users:[{id:"u1",name:"عبدالله",email:"admin@team.co",admin:1,active:1},{id:"u2",name:"منى",email:"mona@team.co",stage:"idea",active:1},{id:"u3",name:"كريم",email:"karim@team.co",stage:"design",active:1},{id:"u4",name:"سارة",email:"sara@team.co",stage:"design",active:1},{id:"u5",name:"يوسف",email:"yousef@team.co",stage:"gen",active:1},{id:"u6",name:"هبة",email:"heba@team.co",stage:"edit",active:1},{id:"u7",name:"أحمد",email:"ahmed@team.co",stage:"review",active:0}],
 videos:[{id:"v0",t:"فيديو سابق"},{id:"v1",t:"إعلان رؤى (ديمو)"},{id:"v2",t:"فيديو العميل ٢"}],
 tasks:[{id:"t8",v:"v0",s:"idea",who:"u2",start:"2026-11-10T10:00",due:"2026-11-12T12:00",st:"done",done:"2026-11-12T15:00",rating:3},{id:"t9",v:"v0",s:"design",who:"u3",start:"2026-11-12T15:00",due:"2026-11-14T12:00",st:"done",done:"2026-11-14T10:00",rating:5},{id:"t10",v:"v0",s:"gen",who:"u5",start:"2026-11-14T12:00",due:"2026-11-16T12:00",st:"done",done:"2026-11-16T11:00",rating:4},
 {id:"t1",v:"v1",s:"idea",who:"u2",start:"2026-11-23T10:00",due:"2026-11-24T18:00",st:"done",done:"2026-11-24T16:30",rating:4},{id:"t2",v:"v1",s:"design",who:"u3",start:"2026-11-24T18:00",due:"2026-11-26T15:00",st:"doing"},{id:"t3",v:"v1",s:"gen",who:"u5",start:"2026-11-26T15:00",due:"2026-11-28T12:00",st:"todo"},{id:"t4",v:"v1",s:"edit",who:"u6",start:"2026-11-28T12:00",due:"2026-12-01T16:30",st:"todo"},{id:"t5",v:"v1",s:"review",who:"u7",start:"2026-12-01T16:30",due:"2026-12-03T14:00",st:"todo"},
 {id:"t6",v:"v2",s:"idea",who:"u2",start:"2026-11-24T09:00",due:"2026-11-25T17:00",st:"doing"},{id:"t7",v:"v2",s:"design",who:"u4",start:"2026-11-25T17:00",due:"2026-11-27T13:00",st:"todo"}]});
let D=MOCK?(JSON.parse(localStorage.getItem("pl3")||"null")||seed()):{stages:[],settings:{},users:[],videos:[],tasks:[]};
let me=MOCK?(q.get("as")||localStorage.getItem("me")):null,tab=q.get("tab")||"home",vid=null,MUST=false,BUSY=false;const OPEN={};
const NOW=MOCK?"2026-11-25T19:16":null;const now=()=>NOW||(d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16))(new Date());
const U=id=>D.users.find(u=>u.id==id);const SN=id=>(D.stages.find(s=>s.id==id)||{}).name||"";
const stLabel={todo:"لسه",doing:"شغال",done:"خلص"};
const fmtT=d=>{if(!d)return"";const [a,b]=d.split("T");return a.slice(5).replace("-","/")+" "+(b||"")};const fmt=d=>d?fmtT(d):"بدون موعد";
const ini=n=>esc((n||"?").trim()[0]);
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
const ERR={setup_fail:"الإيميل ده مش متاح للتسجيل لأول مرة. راجع إنك كاتب الإيميل صح بالظبط (حرف ناقص أو غلط؟). لو سجلت قبل كده ادخل بكلمة السر، ولو لأ كلّم المدير",bad_login:"الإيميل أو كلمة السر غلط",too_many:"محاولات كتير. استنى ربع ساعة وجرب تاني",forbidden:"مش مسموح لك بالعملية دي",exists:"الإيميل ده موجود قبل كده",bad_input:"راجع البيانات المدخلة",weak:"كلمة السر لازم 8 حروف على الأقل",bad_current:"كلمة السر الحالية غلط",last_admin:"لازم يفضل مدير واحد على الأقل",last_stage:"لازم تفضل مرحلة واحدة على الأقل",self:"مينفعش تعمل كده على حسابك",only_done_tasks:"التقييم للمهام اللي خلصت بس",bad_time:"الوقت غير صالح",network:"مفيش اتصال. جرب تاني"};
// ---- data layer
async function api(p,body){let r;try{r=await fetch("/api"+p,{method:body?"POST":"GET",headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined,credentials:"same-origin"})}catch(e){throw{error:"network"}}
 if(r.status==401&&p!="/login"){me=null;R();throw{error:"auth"}}const j=await r.json().catch(()=>({}));if(!r.ok)throw{status:r.status,error:j.error||"error"};return j}
async function load(){if(MOCK){R();return}try{const s=await api("/state");me=s.me;MUST=s.must_change;
 D={stages:s.stages,settings:s.settings,users:s.users.map(u=>({id:u.id,name:u.name,email:u.email,stage:u.stage,admin:u.is_admin,active:u.active})),videos:s.videos.map(v=>({id:v.id,t:v.title})),
 tasks:s.tasks.map(t=>({id:t.id,v:t.video_id,s:t.stage,who:t.assignee||"",start:t.start_at?t.start_at.slice(0,16).replace(" ","T"):"",due:t.due_at?t.due_at.slice(0,16).replace(" ","T"):"",st:t.status,done:t.completed_at?t.completed_at.slice(0,16).replace(" ","T"):"",rating:t.rating,rnote:t.rating_note}))};
 if(!D.videos.find(v=>v.id==vid))vid=D.videos.length?D.videos[D.videos.length-1].id:null}catch(e){if(e.error!="auth"&&e.error!="network")toast("حصل خطأ في التحميل");if(e.error=="network"&&me)toast(ERR.network)}R()}
function mockAct(p,b){const t=id=>D.tasks.find(x=>x.id==id);const pw="Ab3dEf9hJk2m";
 if(p=="/task/status"){const x=t(b.id);x.st=b.status;x.done=b.status=="done"?now():""}
 else if(p=="/task/update"){const x=t(b.id);x.who=b.assignee||"";x.start=b.start||"";x.due=b.due||""}
 else if(p=="/task/rate"){t(b.id).rating=b.rating}
 else if(p=="/video"){const id="v"+Date.now();D.videos.push({id,t:b.title});D.stages.forEach(s=>{const u=D.users.find(u=>u.stage==s.id&&u.active);D.tasks.push({id:id+s.id,v:id,s:s.id,who:u?u.id:"",start:"",due:"",st:"todo"})});vid=id}
 else if(p=="/video/rename"){D.videos.find(v=>v.id==b.id).t=b.title}
 else if(p=="/video/delete"){D.videos=D.videos.filter(v=>v.id!=b.id);D.tasks=D.tasks.filter(x=>x.v!=b.id)}
 else if(p=="/user"){D.users.push({id:"u"+Date.now(),name:b.name,email:b.email,stage:b.stage,active:1});return{initial_password:pw}}
 else if(p=="/user/update"){const u=U(b.id);if(b.name)u.name=b.name;u.stage=b.stage||null}
 else if(p=="/user/active"){U(b.id).active=b.active?1:0}
 else if(p=="/user/admin"){U(b.id).admin=b.admin?1:0}
 else if(p=="/user/reset"){return{initial_password:pw}}
 else if(p=="/stage/add"){const id="s"+Date.now();D.stages.push({id,name:b.name});D.videos.forEach(v=>D.tasks.push({id:v.id+id,v:v.id,s:id,who:"",st:"todo"}))}
 else if(p=="/stage/rename"){D.stages.find(s=>s.id==b.id).name=b.name}
 else if(p=="/stage/move"){const i=D.stages.findIndex(s=>s.id==b.id),j=i+(b.dir<0?-1:1);if(j>=0&&j<D.stages.length)[D.stages[i],D.stages[j]]=[D.stages[j],D.stages[i]]}
 else if(p=="/stage/delete"){D.stages=D.stages.filter(s=>s.id!=b.id);D.tasks=D.tasks.filter(x=>x.s!=b.id);D.users.forEach(u=>{if(u.stage==b.id)u.stage=null})}
 else if(p=="/settings"){Object.assign(D.settings,b)}
 else if(p=="/notify/test"){toast("اتبعت إشعار تجريبي")}
 else if(p=="/password"){MUST=false}
 localStorage.setItem("pl3",JSON.stringify(D));return{ok:1}}
async function act(p,b){if(BUSY)return;BUSY=true;try{let r;if(MOCK){r=mockAct(p,b);R()}else{r=await api(p,b);if(p!="/notify/test")await load()}return r}catch(e){if(e.error!="auth")toast(ERR[e.error]||"حصل خطأ. جرب تاني");return null}finally{BUSY=false}}
// ---- helpers (ui)
const setSt=(id,st)=>act("/task/status",{id,status:st});
const assign=(id,k,v)=>{const t=D.tasks.find(t=>t.id==id);t[k]=v;return act("/task/update",{id,assignee:t.who||null,start:t.start||null,due:t.due||null})};
const rate=(id,n)=>{const t=D.tasks.find(t=>t.id==id);return act("/task/rate",{id,rating:t.rating==n?null:n})};
const tog=k=>{OPEN[k]=!OPEN[k];R()};
function ask(title,fields,ok){document.getElementById("ov").innerHTML=`<div class="modal" onclick="if(event.target==this)this.remove()"><div><b style="font-size:16px">${esc(title)}</b>${fields.map((f,i)=>`<label class="sub">${esc(f.l)}</label>${f.opts?`<select id="f${i}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`:`<input id="f${i}" type="${f.t||"text"}" value="${esc(f.v||"")}" ${f.dir?`dir="${f.dir}"`:""} autocomplete="off">`}`).join("")}
 <div class="row" style="margin-top:16px"><button class="btn g" onclick="document.getElementById('ov').innerHTML=''">إلغاء</button><button class="btn" id="okb">حفظ</button></div></div></div>`;
 document.getElementById("okb").onclick=async()=>{const v=fields.map((f,i)=>document.getElementById("f"+i).value.trim());document.getElementById("ov").innerHTML="";await ok(v)}}
function shown(title,msg){document.getElementById("ov").innerHTML=`<div class="modal"><div><b style="font-size:16px">${esc(title)}</b><p class="sub" style="font-size:14px;line-height:1.8">${msg}</p><button class="btn w" onclick="document.getElementById('ov').innerHTML=''">تمام</button></div></div>`}
const stageOpts=(blank)=>[...(blank?[["","بدون مرحلة"]]:[]),...D.stages.map(s=>[s.id,s.name])];
// ---- auth
async function login(){const e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value;if(MOCK){const u=D.users.find(u=>u.email==e.toLowerCase()&&u.active);if(!u)return toast(ERR.bad_login);me=u.id;localStorage.setItem("me",me);R();return}
 try{await api("/login",{email:e,password:p});await load()}catch(x){toast(ERR[x.error]||"حصل خطأ")}}
function firstTime(){ask("أول مرة؟ اختار كلمة السر",[{l:"الإيميل اللي المدير ضافه",t:"email",dir:"ltr"},{l:"كلمة السر اللي تختارها (8 حروف على الأقل)",t:"password"}],async v=>{try{await api("/setup",{email:v[0].trim(),password:v[1]});await load();toast("أهلاً بيك")}catch(x){toast(ERR[x.error]||"حصل خطأ")}})}
async function out(){if(!MOCK)try{await api("/logout",{})}catch(_){}localStorage.removeItem("me");me=null;R()}
function changePw(forced){ask(forced?"غيّر كلمة السر قبل ما تكمل":"تغيير كلمة السر",[{l:"كلمة السر الحالية",t:"password"},{l:"كلمة السر الجديدة (8 حروف على الأقل)",t:"password"}],async v=>{const r=await act("/password",{current:v[0],new:v[1]});if(r)toast("اتغيرت كلمة السر")})}
// ---- people stats
function late(t){return t.st=="done"?(t.due&&t.done&&t.done>t.due):(t.due&&t.due<now())}
function pstats(uid){const ts=D.tasks.filter(t=>t.who==uid);const dn=ts.filter(t=>t.st=="done");const wd=dn.filter(t=>t.due&&t.done);const on=wd.filter(t=>t.done<=t.due).length;const rs=dn.filter(t=>t.rating);
 return{ts,dn:dn.length,open:ts.length-dn.length,ontime:wd.length?Math.round(on/wd.length*100):null,avg:rs.length?rs.reduce((a,t)=>a+t.rating,0)/rs.length:null,nr:rs.length}}
